<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">

<title>{{subject}}</title>
</head>
<body style="margin:0;padding:0;background-color:#0a0a0a;color:#f5f5f5;font-family:'Geist',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;">

<tr>

{{button}}

{{fallback}}

</tr>
<tr>
<td align="center" style="padding:32px 16px 0;font-size:12px;line-height:20px;color:#848484;">

</table>

</html>
